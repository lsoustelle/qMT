[build-system]
requires      = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project.scripts]
fit-JSPqMT  = "qmt.fit_JSPqMT_CLI:main"
fit-MTsat   = "qmt.fit_MTsat_CLI:main"
fit-SPqMT   = "qmt.fit_SPqMT_CLI:main"
fit-VFA     = "qmt.fit_VFA_CLI:main"
synt-SPGR   = "qmt.synt_SPGR_CLI:main"

[project]
name            = "qmt"
version         = "0.1"
description     = "Package for qMT MRI analyses"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages   = ["qmt"]